services:
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: garage
    volumes:
      - ./garage.toml:/etc/garage.toml
      - ./meta:/var/lib/garage/meta
      - ./data:/var/lib/garage/data
    restart: unless-stopped
    ports:
      - 3900:3900
      - 3901:3901
      - 3902:3902
      - 3903:3903

  webui:
    image: ghcr.io/suorcd/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped
    depends_on:
      - garage
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      - 3909:3909
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
      AUTH_USER_PASS: "${AUTH_USER_PASS:?set AUTH_USER_PASS}"
      # The image is FROM scratch and has no .env, so compose must forward
      # this explicitly. The default keeps the Secure cookie; a plain HTTP
      # install sets SESSION_COOKIE_SECURE=false in .env.
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
