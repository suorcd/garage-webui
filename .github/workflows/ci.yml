name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  nix:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build -L

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: garage-webui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name garage-webui-ci -p 3919:3909 \
            -e AUTH_DISABLED=true \
            -e CONFIG_PATH=/nonexistent \
            -e API_BASE_URL=http://127.0.0.1:3903 \
            -e API_ADMIN_KEY=ci-placeholder \
            garage-webui:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3919/ >/dev/null; then
              echo "The UI responded."
              exit 0
            fi
            sleep 1
          done
          docker logs garage-webui-ci
          exit 1
      - name: Stop the container
        if: always()
        run: docker rm -f garage-webui-ci || true
