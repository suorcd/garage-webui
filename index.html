<!DOCTYPE html>
<html lang="en" data-theme="suorcd">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Garage Web UI</title>
    <script>
      window.__BASE_PATH = "%BASE_PATH%";
    </script>
    <script>
      // Apply the persisted theme before first paint, so the page never
      // flashes the default theme. Keep the list in sync with
      // src/app/themes.ts.
      var __theme = "suorcd";
      try {
        var __stored = JSON.parse(
          localStorage.getItem("appdata") || "null",
        );
        var __saved = __stored && __stored.state && __stored.state.theme;
        var __themes = [
          "suorcd",
          "pastel",
          "dark",
          "dracula",
          "cupcake",
          "dim",
          "night",
          "nord",
          "corporate",
          "valentine",
          "winter",
        ];
        if (__themes.indexOf(__saved) !== -1) {
          __theme = __saved;
        }
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", __theme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
